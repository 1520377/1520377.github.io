name: price-hook
on:
  push:
    paths:
      - '.github/workflows/price-hook.yml'
      - 'tools/patch_price_hook.py'
permissions:
  contents: write
jobs:
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: insert hook
        run: python3 tools/patch_price_hook.py
      - name: commit
        run: |
          git config user.name "doubao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update price hook"
          git push
