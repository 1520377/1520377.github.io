name: price
on:
  schedule:
    - cron: '20 9 * * 1-5'
  push:
    paths:
      - '.github/workflows/price.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: fetch close price
        run: python3 tools/update_price.py
      - name: commit
        run: |
          git config user.name "doubao-bot"
          git config user.email "bot@users.noreply.github.com"
          git add price.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update gold price"
          git push
